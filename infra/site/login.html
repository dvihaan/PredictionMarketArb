<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prediction market data — sign in</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --card: #fff; --fg: #1d2330; --muted: #5d6675; --accent: #2b62d9; --line: #d9dde4; --bad: #b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14171c; --card: #1d2129; --fg: #e6e9ef; --muted: #9aa3b2; --accent: #7aa2ff; --line: #2e3440; --bad: #ff8a80; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 28px; width: 100%; max-width: 360px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
          background: transparent; color: var(--fg); font: inherit; }
  button { margin-top: 12px; width: 100%; padding: 10px; border: 0; border-radius: 6px; background: var(--accent); color: #fff;
           font: inherit; font-weight: 600; cursor: pointer; }
  .err { color: var(--bad); font-size: 14px; min-height: 1.5em; margin-top: 10px; }
</style>
</head>
<body>
<form id="f">
  <h1>Prediction market data</h1>
  <p>Kalshi and Polymarket order books and trades. Enter the access password.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required autofocus>
  <button type="submit">Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
  // The site accepts a cookie holding the SHA-256 of the password; the password itself is never stored.
  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = document.getElementById("err");
    err.textContent = "";
    const hash = await sha256Hex(document.getElementById("pw").value);
    document.cookie = `pma_auth=${hash}; Path=/; Max-Age=${30 * 86400}; Secure; SameSite=Strict`;
    const check = await fetch("/curated/manifest.json", {cache: "no-store"});
    if (check.status === 401) {
      document.cookie = "pma_auth=; Path=/; Max-Age=0; Secure; SameSite=Strict";
      err.textContent = "Wrong password.";
      return;
    }
    location.href = "/";
  });
</script>
</body>
</html>
